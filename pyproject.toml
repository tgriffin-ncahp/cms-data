[project]
name = "cms-data"
version = "0.1.0"
description = "Python library and CLI for browsing CMS Medicaid data interfaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "sqlalchemy-orm>=1.2.10",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
cms-data = "cms_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
